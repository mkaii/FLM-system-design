<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pub/Sub in Spring Boot</title>
<link rel="stylesheet" href="net.css">
<link rel="stylesheet" href="redis.css">
<link rel="stylesheet" id="themeCss" href="mono.css">
<script>try { if (localStorage.getItem('redisTheme') === 'neon') document.getElementById('themeCss').href = 'fancy.css'; } catch (e) {}</script>
<style>
.ln { font: 11.5px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 17px; color: var(--muted); }
.ln.ok { color: var(--good); font-weight: 600; }
.ln.bad { color: var(--bad); font-weight: 600; }
.pay { font: 11.5px/1.45 "JetBrains Mono", ui-monospace, Menlo, monospace; text-align: left; white-space: pre; padding: 6px 8px; border: 1px solid #444; border-radius: 6px; background: #0c0c0c; color: #d6d6d6; }
.pay.new { border-color: var(--good); }
.code { margin: 0; padding: 12px 14px; border-radius: 9px; font: 12.5px/1.55 "JetBrains Mono", ui-monospace, Menlo, monospace; white-space: pre; overflow-x: auto; background: #0f0f0f; border: 1px solid #3a3a3a; color: #d6d6d6; }
.code .an { color: #ffffff; font-weight: 600; }
.code .cm { color: #6e6e6e; }
.score { font-size: 14px; }
.score td { padding: 6px 10px; white-space: normal; }
.score th { padding: 4px 10px; }
.rule { margin-top: 10px; padding: 9px 12px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Redis Pub/Sub in Spring Boot</h1>
    <div style="display: flex; gap: 10px; align-items: center;">
      <nav class="pages"><a class="on" href="pubsub-springboot.html">Animation</a></nav>
      <button id="bTheme" type="button"></button>
    </div>
  </header>
  <div class="box">
    <div class="row"><div class="row-t">Step</div><div class="row-c" id="scen"></div></div>
    <div class="story" id="story"></div>
    <div id="msg"><div id="msgText"></div><div class="ctl"><button id="bPause"></button><button id="bStep" disabled>Next step &#8594;</button></div></div>
    <div id="stage"></div>
    <div class="two" id="final">
      <div><div class="qt" id="t1">Java code for this step</div><pre class="code" id="code"></pre></div>
      <div><div class="qt t" id="t2">What you see</div><div id="endView"></div></div>
    </div>
    <div class="answer" id="answer">
      <div class="ans-h"><span>The answer</span><button id="bAns">Show answer</button></div>
      <ul id="ansList"></ul>
    </div>
    <div class="footer">
      <label>Speed <input id="speed" type="range" min="0.4" max="3" step="0.1" value="1" autocomplete="off"></label>
      <span class="hint">Space = start / pause, &#8594; = next step</span>
      <span class="sp"></span>
      <button id="bRestart">Restart</button>
    </div>
  </div>
</div>

<script src="net-core.js"></script>
<script>
const $ = s => document.querySelector(s);
Net.mount(500, 1.1);

const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const say = (html, kind) => Net.say(html, kind);
const send = (a, b, label, cls, dur) => Net.send(a, b, { label, cls: cls || '', dur: dur || 900 });
const lost = (a, b, label) => Net.send(a, b, { label, cls: 'bad', dur: 900, stopAt: 0.6 });
const wait = (ctx, ms) => Net.wait(ctx, ms);
const big = (v, unit) => `<div class="big">${v}${unit ? `<small>${unit}</small>` : ''}</div>`;
const setC = (id, v, unit, state) => Net.set(id, { body: big(v, unit), state: state || '' });
const line = (id, text, cls) => Net.set(id, { body: `<div class="ln ${cls || ''}">${esc(text)}</div>` });

const JSON_ORDER = '{\n  "id": 501,\n  "item": "Pizza",\n  "customer": "Zoya",\n  "restaurant": "Pizza Hut",\n  "address": "MG Road, Pune"\n}';
const JSON_FLAT = '{"id":501,"item":"Pizza","customer":"Zoya","restaurant":"Pizza Hut","address":"MG Road, Pune"}';

// the four subscriber services, top to bottom on the right
const SUBS = [
  ['em', 'email-service', ':9011', 'sending confirmation to Zoya'],
  ['rs', 'restaurant-service', ':9012', 'telling Pizza Hut to start preparing Pizza'],
  ['dl', 'delivery-service', ':9013', 'rider assigned: Pizza Hut → MG Road'],
  ['an', 'analytics-service', ':9014', 'orders today: 1']
];

// ---------- layout used by the "whole system" steps ----------
// o.redis: draw the Redis channel in the middle;  o.five: leave room for a fifth service
function system(o) {
  o = o || {};
  const gap = o.five ? 92 : 110, top = o.five ? 66 : 85;
  Net.node('pm', { x: 75, y: 250, label: 'Postman', sub: 'POST /orders', kind: 'client', w: 130 });
  Net.node('os', { x: 250, y: 250, label: 'order-service', sub: o.redis ? ':9010 · publisher' : ':9010', kind: 'proxy', w: 170 });
  Net.link('pm', 'os');
  if (o.redis) {
    Net.node('ch', { x: 500, y: 250, label: 'Redis', sub: 'channel: orders', kind: 'lb', w: 200, body: '<div class="none">stores nothing</div>' });
    Net.link('os', 'ch');
  }
  SUBS.forEach((s, i) => {
    Net.node(s[0], { x: 820, y: top + i * gap, label: s[1], sub: s[2] + (o.redis ? ' · subscriber' : ''), kind: 'client', w: 300, body: '<div class="ln">waiting…</div>' });
    Net.link(o.redis ? 'ch' : 'os', s[0]);
  });
  Net.node('c1', { x: 250, y: 420, label: o.c1 || 'Customer waited', kind: 'count', w: 170, body: big('–') });
}

// ---------- bottom panels ----------
const C = (cls, t) => `<span class="${cls}">${esc(t)}</span>`;
function setPanel(code, right, t1, t2) {
  $('#code').innerHTML = code;
  $('#endView').innerHTML = right;
  $('#t1').textContent = t1 || 'Java code for this step';
  $('#t2').textContent = t2 || 'What you see';
  $('#final').classList.remove('hidden');
}
const consoleCard = lines => '<div class="kc"><div class="kb">' + lines.map(l => `<div class="ln ${l[1] || ''}" style="white-space:normal">${esc(l[0])}</div>`).join('') + '</div></div>';
function compareTable() {
  const rows = [
    ['The customer waits for', 'all four services, one after the other', 'only the publish'],
    ['One service is down', 'the whole order fails', 'the order still succeeds'],
    ['order-service must know', 'every service and its API', 'only the channel name'],
    ['Adding an SMS service', 'change and redeploy order-service', 'the new service just subscribes'],
    ['order-service gets an answer back', 'yes', 'no, only "heard by N"']
  ];
  return '<table class="score"><tr><th></th><th>Step 1: sync API calls</th><th>Step 2: Pub/Sub</th></tr>'
    + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('') + '</table>';
}
const jsonCard = cap => `<div class="kc"><div class="kh"><code>channel: orders</code><span class="ty">message</span></div><div class="kb"><pre>${esc(JSON_ORDER)}</pre><div class="cap">${cap}</div></div></div>`;

// ================= Step 1: the order service calls everyone itself =================
function setup1() {
  system({});
  setPanel(
    C('cm', '// order-service, the hard-wired way: it must know every other service') + '\n'
    + C('an', '@PostMapping("/orders")') + '\n'
    + 'public String placeOrder(@RequestBody Order order) {\n'
    + '    emailClient.sendConfirmation(order);       ' + C('cm', '// waits for email-service') + '\n'
    + '    restaurantClient.startPreparing(order);    ' + C('cm', '// waits for restaurant-service') + '\n'
    + '    deliveryClient.assignRider(order);         ' + C('cm', '// waits for delivery-service') + '\n'
    + '    analyticsClient.countOrder(order);         ' + C('cm', '// waits for analytics-service') + '\n'
    + '    return "Order placed";\n}',
    consoleCard([['Order 501: the customer waits for all four calls to finish', ''], ['Order 502: email-service is down, so the whole order fails', 'bad']]));
}
async function run1(ctx) {
  say('Zoya orders a pizza. Four other services must react. The simple way: <b>order-service calls each one itself</b>, one after the other.');
  await Net.beat(ctx);
  await send('pm', 'os', 'POST /orders');
  let total = 0;
  const cost = [0.3, 0.2, 0.4, 0.1];
  for (let i = 0; i < SUBS.length; i++) {
    const s = SUBS[i];
    say('It calls <b>' + s[1] + '</b> and <b>waits</b> for the answer.');
    await send('os', s[0], 'API call');
    Net.check(ctx);
    line(s[0], s[3], 'ok');
    await send(s[0], 'os', '200 OK', 'ok', 700);
    total += cost[i];
    setC('c1', total.toFixed(1) + ' s');
  }
  await send('os', 'pm', '200 Order placed', 'ok', 700);
  say('Zoya waited for <b>all four</b> services (example timings). And order-service has to <b>know</b> every one of them.', 'err');
  await Net.beat(ctx);

  say('Next order. This time <b>email-service is down</b>.', 'err');
  SUBS.forEach(s => line(s[0], 'waiting…'));
  Net.set('em', { state: 'down', badge: 'down', badgeCls: 'bad' });
  setC('c1', '–');
  await send('pm', 'os', 'POST /orders');
  await lost('os', 'em', 'API call');
  Net.check(ctx);
  Net.flash('os', 'bad');
  await send('os', 'pm', '500 error', 'bad', 700);
  Net.set('c1', { label: 'Result' });
  setC('c1', 'order failed', '', 'hot');
  await Net.beat(ctx);
  say('<b>The pizza was never ordered</b>, only because an email could not be sent. The order service is tied to four other services.', 'err');
}

// ================= Step 2: publish instead =================
function setup2() {
  system({ redis: true });
  setPanel(
    C('cm', '// order-service, with Pub/Sub: it announces, and knows nobody') + '\n'
    + C('an', '@PostMapping("/orders")') + '\n'
    + 'public String placeOrder(@RequestBody Order order) {\n'
    + '    Long receivers = ' + C('an', 'orderPublisher.publish(order)') + ';\n'
    + '    return "Order " + order.getId() + " placed. Heard by " + receivers + " services.";\n}',
    compareTable(),
    'Java code for this step', 'Sync API calls vs Pub/Sub');
}
async function run2(ctx) {
  say('Same order. Now order-service only <b>announces</b> "order placed" on a Redis <b>channel</b> called <b>orders</b>.');
  await Net.beat(ctx);
  say('The four services started earlier and <b>subscribed</b> to that channel. They are waiting.');
  SUBS.forEach(s => line(s[0], 'subscribed to "orders"'));
  Net.set('ch', { body: '<div class="none">listening right now: 4</div>' });
  await Net.beat(ctx);
  await send('pm', 'os', 'POST /orders');
  say('order-service <b>publishes one message</b>: the order, as JSON.');
  await send('os', 'ch', 'PUBLISH orders {…}', 'teal');
  Net.check(ctx);
  Net.flash('ch', 'ok');
  await send('os', 'pm', 'Heard by 4 services', 'ok', 700);
  setC('c1', 'one publish', '', 'good');
  say('It answers Zoya <b>straight away</b>. It did not wait for anybody.');
  await Promise.all(SUBS.map(s => send('ch', s[0], 'order 501', 'ok')));
  Net.check(ctx);
  SUBS.forEach(s => line(s[0], s[3], 'ok'));
  await Net.beat(ctx);
  say('Redis gave <b>every subscriber its own copy</b>. Each one does its own job. order-service does not know who they are.');
  await Net.beat(ctx);

  say('Now the <b>same failure as in step 1</b>: email-service goes down, and another order comes in.', 'err');
  SUBS.forEach(s => line(s[0], 'subscribed to "orders"'));
  Net.set('em', { state: 'down', badge: 'down', badgeCls: 'bad' });
  line('em', 'not running');
  Net.set('ch', { body: '<div class="none">listening right now: 3</div>' });
  setC('c1', '–');
  await Net.beat(ctx);
  await send('pm', 'os', 'POST /orders');
  await send('os', 'ch', 'PUBLISH orders {…}', 'teal');
  Net.check(ctx);
  await send('os', 'pm', '200 Order placed', 'ok', 700);
  Net.set('c1', { label: 'Result' });
  setC('c1', 'order placed', '', 'good');
  await Promise.all([lost('ch', 'em', 'order 502'), send('ch', 'rs', 'order 502', 'ok'), send('ch', 'dl', 'order 502', 'ok'), send('ch', 'an', 'order 502', 'ok')]);
  Net.check(ctx);
  ['rs', 'dl', 'an'].forEach(id => line(id, 'handled order 502', 'ok'));
  await Net.beat(ctx);
  say('<b>The order still succeeds.</b> In step 1 this exact failure cancelled the whole order. Here the other three carry on; only the email is missed (more on that in step 5).', 'win');
}

// ================= Step 3: inside the publisher =================
function setup3() {
  Net.group({ x: 150, y: 60, w: 600, h: 400, label: 'order-service  :9010' });
  Net.node('pm', { x: 75, y: 250, label: 'Postman', sub: 'POST /orders', kind: 'client', w: 130 });
  Net.node('ctl', { x: 270, y: 180, label: 'OrderController', sub: 'placeOrder(order)', kind: 'proxy', w: 190 });
  Net.node('pub', { x: 270, y: 350, label: 'OrderPublisher', sub: 'publish(order)', kind: 'proxy', w: 190 });
  Net.node('tpl', { x: 580, y: 265, label: 'RedisTemplate', sub: 'from RedisConfig · JSON serializer', kind: 'proxy', w: 290, body: '<div class="ln">Order object → bytes</div>' });
  Net.node('ch', { x: 880, y: 265, label: 'Redis', sub: 'channel: orders', kind: 'lb', w: 190, body: '<div class="none">waiting</div>' });
  Net.link('pm', 'ctl'); Net.link('ctl', 'pub'); Net.link('pub', 'tpl'); Net.link('tpl', 'ch');
  setPanel(
    C('cm', '// RedisConfig: we send an OBJECT, Redis carries bytes -> a serializer (like class 61)') + '\n'
    + C('an', '@Bean') + '\n'
    + 'public RedisTemplate&lt;String, Order&gt; redisTemplate(RedisConnectionFactory connectionFactory) {\n'
    + '    RedisTemplate&lt;String, Order&gt; template = new RedisTemplate&lt;&gt;();\n'
    + '    template.setConnectionFactory(connectionFactory);\n'
    + '    template.setKeySerializer(RedisSerializer.string());\n'
    + '    ' + C('an', 'template.setValueSerializer(new JacksonJsonRedisSerializer<>(Order.class));') + '\n'
    + '    return template;\n}\n\n'
    + C('cm', '// OrderPublisher') + '\n'
    + 'public Long publish(Order order) {\n'
    + '    return ' + C('an', 'redisTemplate.convertAndSend("orders", order)') + ';   ' + C('cm', '// PUBLISH orders {...}') + '\n}',
    jsonCard('what a redis-cli tab running SUBSCRIBE orders prints'), null, 'What travels on the channel');
}
async function run3(ctx) {
  say('Inside <b>order-service</b>. It has three small classes and <b>no listener</b>.');
  await Net.beat(ctx);
  say('Postman sends the order as JSON. Spring turns it into an <b>Order object</b> for the controller.');
  await send('pm', 'ctl', 'POST /orders');
  Net.set('ctl', { body: '<div class="pay new">Order { id=501, item="Pizza" … }</div>' });
  await Net.beat(ctx);
  say('The controller hands the Order to <b>OrderPublisher</b>.');
  await send('ctl', 'pub', 'Order object');
  await Net.beat(ctx, 1500);
  say('The publisher calls <b>convertAndSend("orders", order)</b> on the RedisTemplate.');
  await send('pub', 'tpl', 'convertAndSend', 'teal');
  Net.check(ctx);
  say('Redis only carries <b>bytes</b>. The <b>JSON serializer</b> from RedisConfig turns the Order into JSON text.');
  Net.set('tpl', { body: `<div class="pay new">${esc(JSON_FLAT.slice(0, 44))}…</div>` });
  Net.flash('tpl', 'ok');
  await Net.beat(ctx);
  say('The bytes go to Redis as <b>PUBLISH orders {…}</b>. Redis replies with how many subscribers got it.');
  await send('tpl', 'ch', 'PUBLISH orders', 'teal');
  Net.set('ch', { body: '<div class="ln ok">message delivered to 4</div>' });
  await send('ch', 'tpl', '(integer) 4', 'ok', 700);
  await send('tpl', 'pub', '4', 'ok', 600);
  await send('pub', 'ctl', '4', 'ok', 600);
  await send('ctl', 'pm', 'Heard by 4 services', 'ok', 700);
  await Net.beat(ctx);
  say('<b>The publisher side:</b> a serializer (object → bytes) and one call to convertAndSend. Nothing here mentions email, restaurant, delivery or analytics.', 'win');
}

// ================= Step 4: inside a subscriber =================
function setup4() {
  Net.group({ x: 250, y: 60, w: 735, h: 400, label: 'email-service  :9011' });
  Net.node('ch', { x: 115, y: 250, label: 'Redis', sub: 'channel: orders', kind: 'lb', w: 190, body: '<div class="none">no listeners yet</div>' });
  Net.node('con', { x: 420, y: 250, label: 'Listener container', sub: 'from RedisConfig', kind: 'proxy', w: 250, body: '<div class="ln">not started</div>' });
  Net.node('lis', { x: 780, y: 170, label: 'EmailListener', sub: 'onMessage(message, pattern)', kind: 'proxy', w: 320, body: '<div class="ln">waiting to be called</div>' });
  Net.node('out', { x: 780, y: 370, label: 'Console', kind: 'client', w: 320, body: '<div class="ln">—</div>' });
  Net.link('ch', 'con'); Net.link('con', 'lis'); Net.link('lis', 'out');
  setPanel(
    C('cm', '// RedisConfig: "channel orders -> EmailListener"   (= SUBSCRIBE orders)') + '\n'
    + C('an', '@Bean') + '\n'
    + 'public RedisMessageListenerContainer listenerContainer(RedisConnectionFactory connectionFactory,\n'
    + '                                                       EmailListener emailListener) {\n'
    + '    RedisMessageListenerContainer container = new RedisMessageListenerContainer();\n'
    + '    container.setConnectionFactory(connectionFactory);\n'
    + '    ' + C('an', 'container.addMessageListener(emailListener, new ChannelTopic("orders"));') + '\n'
    + '    return container;\n}\n\n'
    + C('cm', '// EmailListener implements MessageListener') + '\n'
    + C('an', '@Override') + '\n'
    + 'public void onMessage(Message message, byte[] pattern) {\n'
    + '    Order order = ' + C('an', 'serializer.deserialize(message.getBody())') + ';   ' + C('cm', '// JSON bytes -> Order') + '\n'
    + '    System.out.println("EMAIL SERVICE -> sending confirmation to " + order.getCustomer());\n}',
    consoleCard([['EMAIL SERVICE      -> sending confirmation to Zoya: your Pizza (order 501) is confirmed', 'ok']]), null, 'Console of email-service');
}
async function run4(ctx) {
  say('Inside <b>email-service</b>, a separate project. First, what happens when it <b>starts</b>.');
  await Net.beat(ctx);
  say('RedisConfig creates a <b>listener container</b> and tells it: channel <b>orders</b> → EmailListener.');
  Net.set('con', { body: '<div class="ln ok">orders → EmailListener</div>' });
  Net.flash('con', 'ok');
  await Net.beat(ctx);
  say('The container opens a connection and <b>subscribes</b>. This is the Java version of typing SUBSCRIBE orders.');
  await send('con', 'ch', 'SUBSCRIBE orders', 'teal');
  Net.set('ch', { body: '<div class="ln ok">listening right now: 1</div>' });
  await Net.beat(ctx);

  say('Later, order-service publishes. Redis <b>pushes the bytes</b> to the container. Nobody polls.');
  Net.set('ch', { body: `<div class="pay new">${esc(JSON_FLAT.slice(0, 26))}…</div>` });
  await send('ch', 'con', 'JSON bytes', 'ok');
  Net.check(ctx);
  say('The container calls <b>onMessage</b> on EmailListener with those bytes.');
  await send('con', 'lis', 'onMessage(bytes)');
  Net.set('lis', { body: `<div class="pay">${esc(JSON_FLAT.slice(0, 40))}…</div>` });
  await Net.beat(ctx);
  say('First line of onMessage: the <b>deserializer</b> turns the JSON bytes back into an <b>Order object</b>.');
  Net.set('lis', { body: '<div class="pay new">Order { id=501, customer="Zoya" … }</div>' });
  Net.flash('lis', 'ok');
  await Net.beat(ctx);
  say('Then it does its job. Here it just prints.');
  await send('lis', 'out', 'println', 'ok', 700);
  Net.set('out', { body: '<div class="ln ok" style="white-space:normal">EMAIL SERVICE -> sending confirmation to Zoya: your Pizza (order 501) is confirmed</div>' });
  await Net.beat(ctx);
  say('<b>The subscriber side:</b> a container (which channel → which listener) and a listener that turns bytes back into an Order. The other three services look the same.', 'win');
}

// ================= Step 4b: who calls onMessage? =================
function setup4b() {
  Net.node('ifc', { x: 180, y: 115, label: 'MessageListener', sub: 'an interface, from Spring', kind: 'proxy', w: 290, body: '<div class="pay">void onMessage(message, pattern);</div>' });
  Net.node('cls', { x: 180, y: 345, label: 'EmailListener', sub: 'our class · implements MessageListener', kind: 'client', w: 290, body: '<div class="pay">@Override\nvoid onMessage(…) { send email }</div>' });
  Net.link('ifc', 'cls', { dashed: true, label: 'implements' });
  Net.node('con', { x: 815, y: 215, label: 'Listener container', sub: 'Spring\'s RedisMessageListenerContainer', kind: 'proxy', w: 320, body: '<div class="ln">listeners it knows: none</div>' });
  Net.node('rd', { x: 815, y: 425, label: 'Redis', sub: 'channel: orders', kind: 'lb', w: 200, body: '<div class="none">waiting</div>' });
  Net.link('con', 'rd');
  setPanel(
    C('cm', '// 1. Spring\'s interface: one abstract method') + '\n'
    + 'public interface MessageListener {\n'
    + '    void onMessage(Message message, byte[] pattern);\n}\n\n'
    + C('cm', '// 2. our class overrides it') + '\n'
    + C('an', '@Component') + '\n'
    + 'public class EmailListener ' + C('an', 'implements MessageListener') + ' {\n'
    + '    ' + C('an', '@Override') + '\n'
    + '    public void onMessage(Message message, byte[] pattern) { ... }\n}\n\n'
    + C('cm', '// 3. inside Spring\'s container (simplified): it only knows the interface') + '\n'
    + 'MessageListener listener = ...;          ' + C('cm', '// really our EmailListener object') + '\n'
    + C('an', 'listener.onMessage(message, pattern);') + '    ' + C('cm', '// EmailListener\'s version runs'),
    '<table class="score"><tr><th>You already taught</th><th>The same idea here</th></tr>'
    + '<tr><td>Polymorphism (class 5)</td><td>The container holds the type MessageListener; the real object\'s method runs</td></tr>'
    + '<tr><td>Observer pattern (class 21)</td><td>Listener = observer, container = subject, onMessage = update()</td></tr>'
    + '<tr><td>Interfaces</td><td>Spring wrote the container years ago without knowing EmailListener would exist</td></tr></table>',
    null, 'Where you have seen this before');
}
async function run4b(ctx) {
  say('Spring gives us an <b>interface</b>, MessageListener, with one abstract method: <b>onMessage</b>. Our EmailListener <b>implements</b> it and overrides that method.');
  await Net.beat(ctx);
  say('At startup, Spring sees <b>@Component</b> and creates <b>one EmailListener object</b>.');
  Net.node('obj', { x: 500, y: 345, label: 'emailListener', sub: 'the object Spring created', kind: 'client', w: 260, body: '<div class="ln">type: EmailListener</div>' });
  Net.link('cls', 'obj');
  await send('cls', 'obj', 'new EmailListener()', 'ok');
  Net.flash('obj', 'ok');
  await Net.beat(ctx);
  say('<b>RedisConfig</b> hands that object to the container: <b>addMessageListener(emailListener, "orders")</b>.');
  Net.node('cfg', { x: 500, y: 115, label: 'RedisConfig', sub: 'our config class', kind: 'client', w: 260, body: '<div class="pay">addMessageListener(\n  emailListener, "orders")</div>' });
  Net.link('obj', 'cfg');
  Net.link('cfg', 'con');
  await send('obj', 'cfg', 'emailListener');
  await send('cfg', 'con', 'addMessageListener', 'teal');
  Net.check(ctx);
  Net.set('con', { body: '<div class="ln ok">orders → a MessageListener</div>' });
  Net.flash('con', 'ok');
  say('The container stores it as a plain <b>MessageListener</b>. It has <b>never heard of EmailListener</b>; it only knows the interface.');
  await Net.beat(ctx);
  say('The container subscribes to the channel, and waits.');
  await send('con', 'rd', 'SUBSCRIBE orders', 'teal');
  Net.set('rd', { body: '<div class="ln ok">listening right now: 1</div>' });
  await Net.beat(ctx, 1500);

  say('An order is published. Redis pushes the bytes to the container.');
  await send('rd', 'con', 'JSON bytes', 'ok');
  Net.check(ctx);
  say('The container runs one line: <b>listener.onMessage(message, pattern)</b>, on the reference it stored.');
  Net.link('con', 'obj');
  await send('con', 'obj', 'listener.onMessage(…)');
  Net.check(ctx);
  Net.set('obj', { body: '<div class="ln ok">EmailListener.onMessage runs</div>' });
  Net.flash('obj', 'ok');
  Net.set('cls', { body: '<div class="pay new">@Override\nvoid onMessage(…) { send email }</div>' });
  say('The reference is of type MessageListener, but the <b>object</b> is an EmailListener. So <b>our overridden method</b> runs. That is polymorphism.');
  await Net.beat(ctx);
  say('<b>We never call onMessage ourselves.</b> We write it, register the object, and the framework calls it when a message arrives. The same container works for all four services.', 'win');
}

// ================= Step 5: a subscriber is down =================
function setup5() {
  system({ redis: true, c1: 'Heard by' });
  SUBS.forEach(s => line(s[0], 'subscribed to "orders"'));
  Net.set('ch', { body: '<div class="none">listening right now: 4</div>' });
  setPanel(
    C('cm', '// nothing changes in the code. Stop email-service, then POST order 502:') + '\n\n'
    + 'Order 502 placed. Heard by ' + C('an', '3') + ' services.\n\n'
    + C('cm', '// convertAndSend returned 3: Redis only counts who is listening right now') + '\n'
    + C('cm', '// start email-service again: it subscribes, but order 502 is not sent to it'),
    consoleCard([
      ['Postman:  Order 502 placed. Heard by 3 services.', 'bad'],
      ['RESTAURANT SERVICE -> telling Burger King to start preparing Burger (order 502)'],
      ['DELIVERY SERVICE   -> rider assigned for order 502: pick up from Burger King, deliver to FC Road, Pune'],
      ['ANALYTICS SERVICE  -> orders today: 2 (latest: Burger from Burger King)'],
      ['EMAIL SERVICE      -> (nothing, even after it restarts)', 'bad']]),
    'What Postman shows', 'What you see (real output)');
}
async function run5(ctx) {
  say('All four are listening. Now <b>email-service is stopped</b> (a crash, or a deploy).', 'err');
  await Net.beat(ctx);
  Net.set('em', { state: 'down', badge: 'stopped', badgeCls: 'bad' });
  line('em', 'not running');
  Net.set('ch', { body: '<div class="none">listening right now: 3</div>' });
  await Net.beat(ctx);
  say('Aman orders a burger: order 502.');
  await send('pm', 'os', 'POST /orders');
  await send('os', 'ch', 'PUBLISH orders {…}', 'teal');
  Net.check(ctx);
  await send('os', 'pm', 'Heard by 3 services', 'bad', 700);
  setC('c1', 3, 'of 4', 'hot');
  await Promise.all([lost('ch', 'em', 'order 502'), send('ch', 'rs', 'order 502', 'ok'), send('ch', 'dl', 'order 502', 'ok'), send('ch', 'an', 'order 502', 'ok')]);
  Net.check(ctx);
  line('rs', 'telling Burger King to start preparing Burger', 'ok');
  line('dl', 'rider assigned: Burger King → FC Road', 'ok');
  line('an', 'orders today: 2', 'ok');
  say('The order <b>still succeeds</b> (unlike step 1). But Redis only delivered to the <b>3</b> that were listening.');
  await Net.beat(ctx);
  say('email-service <b>starts again</b> and subscribes. Redis has <b>nothing stored</b> to give it.');
  Net.set('em', { state: '', badge: 'missed order 502', badgeCls: 'bad' });
  line('em', 'subscribed to "orders" … nothing arrives', 'bad');
  Net.set('ch', { body: '<div class="none">listening right now: 4 · stored: nothing</div>' });
  await Net.beat(ctx);
  say('<b>Aman never gets his confirmation email.</b> Pub/Sub is fire-and-forget: this is its weakness, and the reason for Streams next class.', 'err');
}

// ================= Step 6: add a new service =================
function setup6() {
  system({ redis: true, five: true, c1: 'Heard by' });
  SUBS.forEach(s => line(s[0], 'subscribed to "orders"'));
  Net.set('ch', { body: '<div class="none">listening right now: 4</div>' });
  setPanel(
    C('cm', '// a NEW project: sms-service. It needs only its own listener and config.') + '\n'
    + 'public class SmsListener implements MessageListener {\n'
    + '    public void onMessage(Message message, byte[] pattern) {\n'
    + '        Order order = serializer.deserialize(message.getBody());\n'
    + '        System.out.println("SMS SERVICE -> texting " + order.getCustomer());\n'
    + '    }\n}\n\n'
    + C('cm', '// order-service: ') + C('an', 'zero lines changed, not even restarted'),
    consoleCard([['Postman:  Order 503 placed. Heard by 5 services.', 'ok'], ['SMS SERVICE        -> texting Om', 'ok'], ['(the other four print as before)']]));
}
async function run6(ctx) {
  say('The business wants an <b>SMS</b> for every order too. With API calls, order-service would need new code and a redeploy.');
  await Net.beat(ctx);
  say('With Pub/Sub, a <b>new project</b> simply starts and subscribes to <b>orders</b>.');
  Net.node('sm', { x: 820, y: 66 + 4 * 92, label: 'sms-service', sub: ':9015 · subscriber (new)', kind: 'client', w: 300, body: '<div class="ln">subscribed to "orders"</div>' });
  Net.link('ch', 'sm');
  Net.flash('sm', 'ok');
  Net.set('ch', { body: '<div class="none">listening right now: 5</div>' });
  Net.set('os', { badge: 'code unchanged', badgeCls: 'ok' });
  await Net.beat(ctx);
  say('Om places order 503.');
  await send('pm', 'os', 'POST /orders');
  await send('os', 'ch', 'PUBLISH orders {…}', 'teal');
  Net.check(ctx);
  await send('os', 'pm', 'Heard by 5 services', 'ok', 700);
  setC('c1', 5, 'of 5', 'good');
  await Promise.all(SUBS.map(s => send('ch', s[0], 'order 503', 'ok')).concat([send('ch', 'sm', 'order 503', 'ok')]));
  Net.check(ctx);
  SUBS.forEach(s => line(s[0], 'handled order 503', 'ok'));
  line('sm', 'texting Om: order 503 confirmed', 'ok');
  await Net.beat(ctx);
  say('<b>Five services heard it, and order-service was never touched.</b> The publisher and the subscribers only share a channel name and a message format.', 'win');
}

// ================= Step 7: cheat sheet =================
const SHEET = [
  ['Dependency', 'every service', 'spring-boot-starter-data-redis', '–'],
  ['application.properties', 'every service', 'spring.data.redis.host / port (the same Redis)', '–'],
  ['Order.java', 'every service (its own copy)', 'the payload', 'the message'],
  ['RedisConfig', 'order-service', 'RedisTemplate + JSON serializer', 'Order → bytes'],
  ['OrderPublisher', 'order-service', 'convertAndSend("orders", order)', 'PUBLISH orders {…}'],
  ['RedisConfig', 'each subscriber', 'RedisMessageListenerContainer + ChannelTopic("orders")', 'SUBSCRIBE orders'],
  ['Listener', 'each subscriber', 'implements MessageListener; onMessage: bytes → Order', 'the lines a subscribed terminal prints']
];
function sheetHTML(shown, rule) {
  return '<table class="score"><tr><th>Piece</th><th>Where</th><th>What it is</th><th>Same as in redis-cli</th></tr>'
    + SHEET.map((r, i) => `<tr class="${i < shown ? '' : 'hide'}"><td>${r[0]}</td><td>${r[1]}</td><td><code>${esc(r[2])}</code></td><td>${r[3]}</td></tr>`).join('')
    + '</table>'
    + (rule ? '<div class="rule"><b>Call an API</b> when you need the answer before you continue (check stock, charge the card).<br><b>Publish</b> when you only announce that something happened (email, rider, analytics).<br><b>Remember:</b> a subscriber that is down misses the message. If that is not acceptable, use Streams.</div>' : '');
}
function setup7() {
  Net.node('board', { x: 500, y: 250, label: 'Who has what', kind: 'proxy', w: 950, body: sheetHTML(0, false) });
  $('#final').classList.add('hidden');
}
async function run7(ctx) {
  say('Every piece of today, and the redis-cli command it matches.');
  for (let i = 1; i <= SHEET.length; i++) {
    await wait(ctx, 700);
    Net.set('board', { body: sheetHTML(i, false) });
  }
  await Net.beat(ctx, 1500);
  Net.set('board', { body: sheetHTML(SHEET.length, true) });
  say('<b>Publisher:</b> a serializer and convertAndSend. <b>Subscriber:</b> a container and onMessage.', 'win');
}

// ---------- the question before each step, and the answer after it ----------
const QA = [
  { q: 'order-service calls four other services itself. What does the customer pay for that, and what happens when one of them is down?',
    a: ['The customer waits for <b>all four calls</b> to finish, one after the other.',
        'order-service must <b>know</b> every service: its address, its API, when it changes.',
        'If one service is down, the <b>whole order fails</b>, even though the pizza itself had nothing to do with the email.',
        'This is called <b>tight coupling</b>.'] },
  { q: 'What if order-service only announced "order placed" and did not care who listens?',
    a: ['It <b>publishes one message</b> to the channel <b>orders</b> and replies to the customer immediately.',
        'Redis gives <b>every subscriber its own copy</b> (fan-out).',
        'convertAndSend returns the number of subscribers that received it: "Heard by 4 services".',
        'The publisher and the subscribers share only the <b>channel name</b> and the <b>message format</b>.'] },
  { q: 'order-service wants to send an Order object, but Redis only carries bytes. What does the publisher need?',
    a: ['A <b>serializer</b>, exactly like class 61: RedisConfig builds a RedisTemplate with a JSON serializer (Order → JSON bytes).',
        '<b>convertAndSend("orders", order)</b> is the Java version of PUBLISH orders {…}.',
        'The publisher has <b>no listener config</b>: it does not listen to anything.',
        'Nothing in order-service mentions the other four services.'] },
  { q: 'Nobody in email-service calls onMessage. So who calls it, and how do the bytes become an Order again?',
    a: ['RedisConfig creates a <b>RedisMessageListenerContainer</b> and registers: channel orders → EmailListener.',
        'On startup the container <b>subscribes</b> (the Java version of SUBSCRIBE orders) and keeps the connection open.',
        'When a message arrives, the container calls <b>onMessage</b> with the raw bytes.',
        'The first line of onMessage <b>deserializes</b>: JSON bytes → Order. Then the service does its work.',
        'Redis says "channel"; Spring\'s class is called <b>ChannelTopic</b>.'] },
  { q: 'Nobody in our code calls onMessage, and Spring\'s container has never heard of EmailListener. So how does our method get called?',
    a: ['<b>MessageListener</b> is an interface with one abstract method, onMessage. EmailListener implements it and overrides the method.',
        'Spring creates one EmailListener object (@Component); RedisConfig registers it with the container for the channel orders.',
        'The container keeps it as a <b>MessageListener</b> reference. When a message arrives it calls <b>listener.onMessage(...)</b>.',
        'The real object is an EmailListener, so <b>our version runs</b>: polymorphism.',
        'It is the <b>Observer pattern</b>: listener = observer, container = subject, onMessage = update().'] },
  { q: 'email-service is down for a minute while an order is placed. Does that customer get the confirmation email later?',
    a: ['<b>No.</b> Redis delivers only to subscribers that are listening at that moment, and stores nothing.',
        'The reply says "Heard by 3 services": that number is your only clue.',
        'Good news compared with step 1: the <b>order itself still succeeds</b>.',
        'When the message must not be lost, Pub/Sub is the wrong tool: use <b>Streams</b> (next class).'] },
  { q: 'The business wants an SMS for every order. What has to change in order-service?',
    a: ['<b>Nothing.</b> Not one line, and it does not even restart.',
        'A new project (sms-service) starts with its own listener and its own listener config, and subscribes to orders.',
        'The next order is "Heard by 5 services".',
        'With API calls, order-service would need new code, a new client, and a redeploy.'] },
  { q: 'Which pieces belong to the publisher, and which to a subscriber?',
    a: ['<b>Every service:</b> the Redis starter, the Redis address, and its own copy of Order.',
        '<b>Publisher:</b> a RedisTemplate with a JSON serializer, and convertAndSend.',
        '<b>Subscriber:</b> a listener container (channel → listener), and onMessage that deserializes.',
        'API call when you need the answer; publish when you only announce.'] }
];
let ansOpen = false;
function paintAnswer(i, open) {
  ansOpen = open;
  $('#ansList').innerHTML = QA[i].a.map(t => `<li>${t}</li>`).join('');
  $('#ansList').classList.toggle('hidden', !open);
  $('#bAns').textContent = open ? 'Hide answer' : 'Show answer';
}
document.addEventListener('net:step', e => {
  const i = e.detail.i;
  if (e.detail.state === 'select') $('#story').innerHTML += `<span class="q"><b>Think first:</b> ${QA[i].q}</span>`;
  paintAnswer(i, e.detail.state === 'done');
});
$('#bAns').onclick = () => { const b = document.querySelector('[data-s].on'); paintAnswer(b ? +b.dataset.s : 0, !ansOpen); };

const ASK = '<span class="ask"><b>What the app needs:</b> ';
Net.scenarios([

  { label: '2 With Pub/Sub', story: '<b>Use case:</b> The same order, but order-service announces it on a Redis channel.' + ASK + 'Tell everyone who cares, without knowing who they are.</span>', setup: setup2, run: run2 },
  { label: '3 The publisher', story: '<b>Use case:</b> We open the order-service project.' + ASK + 'Send an Order object to the channel "orders".</span>', setup: setup3, run: run3 },
  { label: '4 A subscriber', story: '<b>Use case:</b> We open the email-service project, a separate Spring Boot app.' + ASK + 'React every time an order is published.</span>', setup: setup4, run: run4 },
  { label: '4b Who calls onMessage', story: '<b>Use case:</b> We wrote onMessage in EmailListener, but no line of our code ever calls it.' + ASK + 'Understand who calls it, and how it finds our class.</span>', setup: setup4b, run: run4b },
  { label: '5 Subscriber down', story: '<b>Use case:</b> email-service is stopped while Aman orders a burger.' + ASK + 'Aman should still get his confirmation email.</span>', setup: setup5, run: run5 },
  { label: '6 Add a service', story: '<b>Use case:</b> The business adds SMS notifications.' + ASK + 'Send an SMS for every order, without touching order-service.</span>', setup: setup6, run: run6 },
  { label: '7 Cheat sheet', story: '<b>Use case:</b> Everything side by side.' + ASK + 'Know which piece goes in which project.</span>', setup: setup7, run: run7 }
], 'Step 1 has <b>no Redis at all</b>: order-service calls the other four services directly.');
