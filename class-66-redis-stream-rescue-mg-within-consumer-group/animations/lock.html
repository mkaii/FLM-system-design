<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed lock</title>
<link rel="stylesheet" href="net.css">
<link rel="stylesheet" href="redis.css">
<link rel="stylesheet" id="themeCss" href="mono.css">
<script>try { if (localStorage.getItem('redisTheme') === 'neon') document.getElementById('themeCss').href = 'fancy.css'; } catch (e) {}</script>
<style>
.nd-badge { right: 8px; }
.nd-badge.ok { background: #fff; color: #000; }
/* a worker's three jobs, ticked off one by one */
.ck div { font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; text-align: left; padding: 2px 8px; margin: 3px 0; border-radius: 6px; color: #7d7d7d; border: 1px solid transparent; }
.ck div::before { content: '\25CB  '; }
.ck .doing { color: #fff; border: 1px dashed #888; }
.ck .doing::before { content: '\2026  '; }
.ck .done { color: var(--good); }
.ck .done::before { content: '\2713  '; }
.ck .x { color: var(--bad); text-decoration: line-through; }
.ck .x::before { content: '\2717  '; }
.ck .sub { font-size: 11px; color: var(--muted); border: 0; padding-top: 0; }
.ck .sub::before { content: ''; }
/* key -> value rows inside Redis or the database */
.kv { display: flex; justify-content: space-between; gap: 12px; font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; padding: 4px 8px; margin: 4px 0; border: 1px solid #444; border-radius: 6px; transition: all .35s; }
.kv span { color: var(--muted); }
.kv b { color: #fff; font-weight: 600; }
.kv.chg { border-color: #fff; background: #262626; }
.kv.bad { border-color: var(--bad); }
.kv.bad b { color: var(--bad); }
.kv.good b { color: var(--good); }
.kv.gone { opacity: .35; text-decoration: line-through; }
/* one big number */
.big { font: 700 38px/1.1 "JetBrains Mono", ui-monospace, monospace; text-align: center; color: #fff; padding: 4px 0; transition: color .3s; }
.big.bad { color: var(--bad); }
.big.good { color: var(--good); }
.cap { font: 11px "JetBrains Mono", monospace; color: var(--muted); text-align: center; }
.mem { white-space: normal; font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; text-align: left; padding: 4px 8px; border: 1px solid #333; border-radius: 6px; background: #0c0c0c; color: #bbb; min-height: 20px; }
.mem b { color: #fff; }
/* the panel under the stage */
.two { grid-template-columns: 1fr; }
table.ct { width: 100%; border-collapse: collapse; font-size: 14px; }
.ct th { text-align: left; font: 11px "JetBrains Mono", monospace; text-transform: lowercase; letter-spacing: .06em; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid #444; font-weight: 400; }
.ct td { padding: 8px 10px; border-bottom: 1px solid #262626; vertical-align: top; }
.ct td.t { width: 120px; white-space: nowrap; color: #fff; font: 600 12px "JetBrains Mono", monospace; }
.ct td.c { width: 40%; }
.ct td.c code { font: 600 13px "JetBrains Mono", ui-monospace, monospace; color: #fff; background: #0f0f0f; border: 1px solid #444; border-radius: 7px; padding: 3px 8px; display: inline-block; white-space: pre-wrap; }
.ct td.m { color: #cfcfcf; line-height: 1.5; }
.sheet { width: 100%; border-collapse: collapse; font-size: 15px; text-align: left; }
.sheet td, .sheet th { padding: 9px 12px; border-bottom: 1px solid #333; vertical-align: top; }
.sheet th { font: 11px "JetBrains Mono", monospace; text-transform: lowercase; color: var(--muted); font-weight: 400; }
.sheet td:first-child { font-weight: 600; color: #fff; white-space: nowrap; }
.sheet tr { transition: opacity .4s; }
.sheet tr.hide { opacity: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Distributed locking</h1>
    <div style="display: flex; gap: 10px; align-items: center;">
      <nav class="pages"><a href="rescue.html">Rescue a stuck entry</a><a href="atomic.html">Atomic updates</a><a class="on" href="lock.html">Distributed lock</a></nav>
      <button id="bTheme" type="button"></button>
    </div>
  </header>
  <div class="box">
    <div class="row"><div class="row-t">Step</div><div class="row-c" id="scen"></div></div>
    <div class="story" id="story"></div>
    <div id="msg"><div id="msgText"></div><div class="ctl"><button id="bPause"></button><button id="bStep" disabled>Next step &#8594;</button></div></div>
    <div id="stage"></div>
    <div class="two" id="final">
      <div><div class="qt">What is sent in this step</div><div id="code"></div></div>
    </div>
    <div class="answer" id="answer">
      <div class="ans-h"><span>The answer</span><button id="bAns">Show answer</button></div>
      <ul id="ansList"></ul>
    </div>
    <div class="footer">
      <label>Speed <input id="speed" type="range" min="0.4" max="3" step="0.1" value="1" autocomplete="off"></label>
      <span class="hint">Space = start / pause, &#8594; = next step</span>
      <span class="sp"></span>
      <button id="bRestart">Restart</button>
    </div>
  </div>
</div>

<script src="net-core.js"></script>
<script src="topics.js"></script>
<script>startTopic('lock');</script>
<script>
// theme switch: mono (default) or neon
(function () {
  const link = document.getElementById('themeCss'), b = document.getElementById('bTheme');
  const paint = () => { b.textContent = link.getAttribute('href') === 'mono.css' ? 'theme: mono' : 'theme: neon'; };
  b.onclick = () => {
    const next = link.getAttribute('href') === 'mono.css' ? 'fancy.css' : 'mono.css';
    link.setAttribute('href', next);
    try { localStorage.setItem('redisTheme', next === 'mono.css' ? 'mono' : 'neon'); } catch (e) {}
    paint();
  };
  paint();
})();
</script>
</body>
</html>
