spring.application.name=order-service
server.port=9030

# The circuit breaker and retry below are both named "payment":
# they protect our calls to payment-service. In order of the tests we ran.
# Each block: comment lines first, the property on the LAST line.


# =====================================================================
#  TEST 1: a normal day (CLOSED) -- how the breaker counts
# =====================================================================

# Judge health on the last N calls.
# (Other option: TIME_BASED = the calls in the last N seconds.)
resilience4j.circuitbreaker.instances.payment.sliding-window-type=COUNT_BASED

# N = the last 5 calls: the MOST calls it ever looks at.
resilience4j.circuitbreaker.instances.payment.sliding-window-size=5

# Don't judge until at least 5 calls: when it STARTS judging.
# Before that, the rates show -1.
#resilience4j.circuitbreaker.instances.payment.minimum-number-of-calls=5


# =====================================================================
#  TEST 2: payment-service fails (CLOSED -> OPEN -> HALF_OPEN)
# =====================================================================

# 50% or more of those calls failed -> OPEN.
resilience4j.circuitbreaker.instances.payment.failure-rate-threshold=50

# Stay OPEN for 10 s: no calls at all, every request goes straight to the fallback.
# (Make it 60s if you want more time to show OPEN in class.)
resilience4j.circuitbreaker.instances.payment.wait-duration-in-open-state=10s

# After those 10 s, move to HALF_OPEN by itself (without waiting for a request).
resilience4j.circuitbreaker.instances.payment.automatic-transition-from-open-to-half-open-enabled=true

# HALF_OPEN lets 2 trial calls through: both fine -> CLOSED, too many fail -> OPEN again.
resilience4j.circuitbreaker.instances.payment.permitted-number-of-calls-in-half-open-state=2


# =====================================================================
#  TEST 3: payment-service is slow (opens with zero errors)
# =====================================================================

# A call slower than 2 s counts as "slow".
resilience4j.circuitbreaker.instances.payment.slow-call-duration-threshold=2s

# 50% or more of the calls were slow -> OPEN (even if none failed).
resilience4j.circuitbreaker.instances.payment.slow-call-rate-threshold=50


# =====================================================================
#  TEST 4: retry + circuit breaker (only POST /orders-with-retry)
# =====================================================================

# Try payment-service up to 3 times per request (1 call + 2 retries).
resilience4j.retry.instances.payment.max-attempts=3

# Wait 0.5 s between tries.
resilience4j.retry.instances.payment.wait-duration=500ms

# When the breaker is OPEN, don't retry: fail fast.
resilience4j.retry.instances.payment.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException


# =====================================================================
#  WATCHING THE BREAKER (/actuator endpoints, used in every test)
# =====================================================================

# Show the breaker in /actuator/health.
resilience4j.circuitbreaker.instances.payment.register-health-indicator=true

# Which /actuator endpoints are visible.
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents

# Include the circuit breaker in /actuator/health.
management.health.circuitbreakers.enabled=true

# Show full details in /actuator/health, not just UP / DOWN.
management.endpoint.health.show-details=always
